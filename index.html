<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysticText</title>
</head>
<body>
    <header>
        <h1>MysticText</h1>
        <p>Ferramenta de manipulação de texto no navegador</p>
    </header>


    <main>
        <section>
            <h2 id="input-heading">Texto de entrada</h2>
            <textarea name="input-text" id="input-text"
            rows="8" placeholder="Digite ou cole seu texto aqui..." aria-label="Área de entrada de texto"></textarea>
        </section>

        <section>
            <h2 id="tools-heading">Ferramentas</h2>
            <nav>
                <button type="button" data-action="uppercase">Maiúsculas</button>
                <button type="button" data-action="lowercase">Minúsculas</button>
                <button type="button" data-action="titlecase">Formato título</button>
                <button type="button" data-action="alternating">Alternado</button>
                <button type="button" data-action="reverse">Inverter texto</button>
                <button type="button" data-action="remove-spaces">Remover espaços extras</button>
            </nav>
        </section>

        <section>

        </section>
    </main>


    <footer>

    </footer>
</body>
</html>
